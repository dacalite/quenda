# SPDX-License-Identifier: EUPL-1.2
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint, formato e cabeceiras SPDX
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Licenzas das dependencias
        run: npm run licenses
      - name: Especificación OpenAPI
        run: npm run api:lint
      - name: Tests unitarios
        run: npm test
      - name: Navegador para os tests e2e
        run: npx playwright install --with-deps chromium
      - name: Tests e2e e accesibilidade (axe)
        run: npm run e2e
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Build
        run: npm run build
